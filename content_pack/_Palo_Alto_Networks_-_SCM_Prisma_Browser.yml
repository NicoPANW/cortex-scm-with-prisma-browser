                rule_id=rule_id,
                tsg_id=tsg_id,
                name=name,
                description=description,
                mode=mode,
                add_user_ids=add_user_ids,
            )
        except DemistoException as e:
            # Intercept "already exists in scope" validation errors gracefully
            if e.res is not None and e.res.status_code == 400:
                try:
                    err_json = e.res.json()
                    err_msg = err_json.get("error", {}).get("message", "")
                    if "already exists in the current scope" in err_msg:
                        return CommandResults(
                            readable_output=f"### Rule Update Note\nThe user with ID {add_user_ids} already exists in the scope of rule `{rule_id}`."
                        )
                except ValueError:
                    pass
            raise e

        return CommandResults(
            outputs_prefix=f"{PA_OUTPUT_PREFIX}BrowserAccessPolicyAccessAndDataRule",
            outputs_key_field="id",
            outputs=raw_response,
            readable_output=tableToMarkdown(f"Successfully updated rule {rule_id}", raw_response, headerTransform=string_to_table_header, removeNull=True),
